dataset: CWQ
split: test
mode: chatkbqa_cwq
kb: freebase
endpoint_url: "http://localhost:3001/sparql"
note: "official run"

entity_linkers: "ChatKBQA.type_map,ChatKBQA.gold_exact,ChatKBQA.gold_simcse,ChatKBQA.facc1"
predicate_linkers: "ChatKBQA.simple,ChatKBQA.neighborhood"

dataset_config: configs/datasets/CWQ.yaml
training_config: configs/training/Freebase/CWQ/ChatKBQA_CWQ.yaml
infer_config: configs/infer/default.yaml

resolve:
  k1_per_pass: "500,30"
  k2_per_pass: "1,300"
  beam_limits: "8"
  linker_params: {}
  label_fallback: true
  debug: true

eval:
  get_live_gold: true
  live_only: true