### Model
model_name_or_path: LLMs/Models/Qwen25-7b-hf/

### Method
stage: sft
do_train: true
finetuning_type: lora

### LoRA config - target more layers for better SPARQL learning
lora_target: all  # or at least: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
lora_rank: 64  # increased from default 8 for better capacity
lora_alpha: 128
lora_dropout: 0.05

### Dataset
dataset: Qald7_train.sparql
dataset_dir: LLMs/data
template: qwen
overwrite_cache: true
cutoff_len: 2048
val_size: 0.1

### Output
output_dir: LLMs/MyModels/Qwen25-7b_Qald7-sparql/
logging_steps: 5
save_steps: 20
plot_loss: true
overwrite_output_dir: true
save_total_limit: 3


per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2e-5
num_train_epochs: 1000.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
weight_decay: 0.01
max_grad_norm: 1.0