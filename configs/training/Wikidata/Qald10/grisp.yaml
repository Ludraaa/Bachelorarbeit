### Model
model_name_or_path: LLMs/Models/Qwen25-7b-hf/

### Method
stage: sft
do_train: true
finetuning_type: lora

### LoRA config
lora_target: all
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.05

### Dataset
dataset: Qald10_train.sparql
dataset_dir: LLMs/data
template: qwen
overwrite_cache: true
cutoff_len: 2048


### Eval
val_size: 0.1
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 20

### Output
output_dir: LLMs/MyModels/Qwen25-7b_Qald10-grisp/
logging_steps: 5
save_steps: 20
plot_loss: true
overwrite_output_dir: true
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false


per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1e-4
num_train_epochs: 4.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
weight_decay: 0.01
max_grad_norm: 1.0