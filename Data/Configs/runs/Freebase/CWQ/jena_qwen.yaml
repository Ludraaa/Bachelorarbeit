dataset: CWQ
split: test
mode: jena
kb: freebase
endpoint_url: "http://localhost:3003/sparql"
note: "official run"

entity_linkers: "ChatKBQA.type_map,ChatKBQA.facc1"
predicate_linkers: "ChatKBQA.simple,ChatKBQA.neighborhood"

dataset_config: configs/datasets/CWQ.yaml
training_config: configs/training/Freebase/CWQ/Qwen25-7b_jena.yaml
infer_config: configs/infer/default.yaml

generate:
  num_beams: 8
  diversity_penalty: 0.4

resolve:
  k1_per_pass: "100,15"
  k2_per_pass: "5,15"
  beam_limits: "8"
  linker_params: {}
  debug: true

eval:
  get_live_gold: true